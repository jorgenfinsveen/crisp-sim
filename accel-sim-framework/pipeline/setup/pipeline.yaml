name_prefix: sim


instances:
  #- ORIN_2D
  #- ORIN_1D
  #- BASELINE_ORIN
  #- ORIN_1U
  #- ORIN_2U
  - BASELINE_RTX3070
  # - ORIN_1
  # - ORIN_2
  # - ORIN_3
  # - ORIN_2s
  # - ORIN_3s
  # - ORIN_4
  # - ORIN_5
  - RTX3070_1
  - RTX3070_2
  - RTX3070_D1
  - RTX3070_D2
  # - RTX3070_3
  # - RTX3070_4
  # - RTX3070_5



experiment:
  name: rendering-4k-local
  path: $ACCEL_SIM/pipeline/setup/experiments.yaml


#Options for collect
collect:
  detailed: true
  metric: gcstack_base


launcher: idun
override_names: true
aggregate: true


# For Slurm jobs.
# See more configuration-options in accel-sim-framework/util/job_launching/idun.yaml.
job_mem: 64G # Default is 4G, but this turned out to be insufficient for the workloads in the artifact.


extra_configs:
  - SASS
  - concurrent
  - fg
  - VISUAL


trace_lookup: $ACCEL_SIM/pipeline/setup/traces.yaml


config_destinations:
  gpgpusim: $ACCEL_SIM/gpu-simulator/gpgpu-sim/configs/custom-cfgs
  trace: $ACCEL_SIM/gpu-simulator/configs/custom-cfgs
