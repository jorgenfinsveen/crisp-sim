#crisp-shared-all-render
rendering_sm_sensitivity:
  params:
    - gpgpu_n_clusters
  results:
    - gcstack_base
    - gcstack_idle
    - gcstack_finished
    - gcstack_empty_ibuf
    - gcstack_last_ins
    - gcstack_sync
    - gcstack_control
    - gcstack_mem_data
    - gcstack_com_data
    - gcstack_mem_struct
    - gcstack_com_struct
    - gcstack_tot
  benchmarks:
    - crisp-shared-all-render:render_passes_2k
    - crisp-shared-all-render:render_passes_2k_lod0
    - crisp-shared-all-render:gears_2k
    - crisp-shared-all-render:instancing_2k
    - crisp-shared-all-render:pbrtexture_2k
    - crisp-shared-all-render:tessellation_2k
  results_dir: /cluster/projects/itea_lille-idi-epic-studenter/crisp
  logfiles: /cluster/projects/itea_lille-idi-epic-studenter/crisp/logfiles


