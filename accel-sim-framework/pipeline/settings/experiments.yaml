rendering_sm_sensitivity:
  params:
    - gpgpu_n_clusters
  results:
    - gcstack_base
    - gcstack_idle
    - gcstack_finished
    - gcstack_empty_ibuf
    - gcstack_last_ins
    - gcstack_sync
    - gcstack_control
    - gcstack_mem_data
    - gcstack_com_data
    - gcstack_mem_struct
    - gcstack_com_struct
    - gcstack_tot
  benchmarks:
    - crisp:render_passes_2k
    - crisp:render_passes_2k_lod0
    - crisp:gears_2k
    - crisp:instancing_2k
    - crisp:pbrtexture_2k
    - crisp:tessellation_2k
  results_dir: $RESULT_ROOT
  logfiles: $RESULT_ROOT/logfiles


