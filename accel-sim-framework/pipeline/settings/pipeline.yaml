name_prefix: sim


instances:
# Streaming multiprocessors
    # Jetson AGX Orin
    # - ORIN_2D
    # - ORIN_1D
    - BASELINE_ORIN
    # - ORIN_1U
    # - ORIN_2U

    # GeForce RTX 3070
    # - RTX3070_2D
    # - RTX3070_1D
    - BASELINE_RTX3070
    # - RTX3070_1U
    # - RTX3070_2U


# # Memory controllers
#     # Jetson AGX Orin
#     - ORIN_N_MEM_8
#     - ORIN_N_MEM_16
#     - ORIN_N_MEM_32

#     # GeForce RTX 3070
#     - RTX3070_N_MEM_8
#     - RTX3070_N_MEM_16
#     - RTX3070_N_MEM_32


# Cluster hierarchy
    # Jetson AGX Orin
    - ORIN_TPC
    - ORIN_GPC

    # GeForce RTX 3070
    - RTX3070_TPC
    - RTX3070_GPC




experiment:
  name: cluster-sensitivity #sponza-and-deer-resolution-concurrent # debugging-short # artifact
  path: /cluster/projects/itea_lille-idi-epic-studenter/crisp/settings/experiments.yaml

shared_mode:
  shared: true
  root: /cluster/projects/itea_lille-idi-epic-studenter/crisp
  results_root: /cluster/projects/itea_lille-idi-epic-studenter/crisp


#Options for collect
collect:
  detailed: true
  metric: gcstack_base
  stats: gcstack
  stats_dir: $ACCEL_SIM/util/job_launching/stats


launcher: idun
override_names: true
aggregate: true


# For Slurm jobs.
# See more configuration-options in accel-sim-framework/util/job_launching/idun.yaml.
job_mem: 64G # Default is 4G, but this turned out to be insufficient for the workloads in the artifact.


extra_configs:
  - SASS
  - concurrent
  - fg
  - VISUAL


trace_lookup: $ACCEL_SIM/pipeline/settings/traces.yaml


config_destinations:
  gpgpusim: $ACCEL_SIM/gpu-simulator/gpgpu-sim/configs/custom-cfgs
  trace: $ACCEL_SIM/gpu-simulator/configs/custom-cfgs
