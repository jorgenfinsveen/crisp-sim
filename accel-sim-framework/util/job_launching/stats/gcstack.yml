    - 'total dram writes\s*=\s*(.*)'
    - 'kernel_launch_uid\s*=\s*(.*)'
    - 'gpu_tot_sim_insn\s*=\s*(.*)'
    - 'gpu_tot_sim_cycle\s*=\s*(.*)'
    - 'gpgpu_simulated_cycles\s*=\s*(.*)'
