    - 'DRAM_BW\s*=\s*(.*)GB\/Sec'
    - 'DRAM_BW_total\s*=\s*(.*)GB\/Sec'
    - 'gpu_stall_dramfull\s*=\s*(.*)'


collect_rates:
    - 'gpgpu_simulation_rate\s+=\s+(.*)\s+\(inst\/sec\)'
